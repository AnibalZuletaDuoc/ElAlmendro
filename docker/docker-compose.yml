# TimeFlow - servicios de infraestructura local (capas 4 y 5 del diagrama)
# Levanta: PostgreSQL 16 (datos) y MinIO (evidencias / archivos)
services:
  db:
    image: postgres:16-alpine
    container_name: timeflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timeflow_dev}
      POSTGRES_DB: ${POSTGRES_DB:-timeflow}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timeflow_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timeflow} -d ${POSTGRES_DB:-timeflow}"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    image: minio/minio:latest
    container_name: timeflow-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-timeflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-timeflow_dev}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - timeflow_storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Crea el bucket de evidencias una sola vez y termina.
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 ${MINIO_ROOT_USER:-timeflow} ${MINIO_ROOT_PASSWORD:-timeflow_dev} &&
      mc mb --ignore-existing local/${S3_BUCKET:-timeflow-evidencias} &&
      echo 'bucket listo'
      "

  # Adminer: consola web para inspeccionar la base (opcional, perfil 'tools')
  adminer:
    image: adminer:latest
    container_name: timeflow-adminer
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  timeflow_db_data:
  timeflow_storage_data:
